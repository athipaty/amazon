<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 270" width="1200" height="270">

  <!-- Background -->
  <rect width="1200" height="270" fill="#0F3D3E"/>

  <!-- Decorative circles (background texture) -->
  <circle cx="1100" cy="-30" r="200" fill="#FFB703" opacity="0.07"/>
  <circle cx="1050" cy="300" r="160" fill="#FFB703" opacity="0.05"/>
  <circle cx="-20"  cy="280" r="180" fill="#FF5D5D" opacity="0.05"/>
  <circle cx="600"  cy="135" r="320" fill="white"   opacity="0.02"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="6" height="270" fill="#FFB703"/>

  <!-- ── BELL ICON (left side) ── -->
  <g transform="translate(55, 18) scale(0.58)">
    <!-- squircle bg -->
    <rect width="400" height="400" rx="80" fill="#FFF8EF" opacity="0.1"/>
    <!-- shadow -->
    <ellipse cx="200" cy="305" rx="80" ry="10" fill="#0F3D3E" opacity="0.2"/>
    <!-- handle -->
    <path d="M145,170 Q145,95 200,95 Q255,95 255,170"
          fill="none" stroke="#FFB703" stroke-width="22" stroke-linecap="round"/>
    <!-- bell body -->
    <path d="M145,170 C127,196 105,234 103,276 C101,296 117,314 142,318 L258,318 C283,314 299,296 297,276 C295,234 273,196 255,170 Z"
          fill="#FFB703"/>
    <!-- inner highlight -->
    <ellipse cx="172" cy="232" rx="15" ry="30" fill="white" opacity="0.2" transform="rotate(-10,172,232)"/>
    <!-- rim -->
    <path d="M103,276 C105,286 109,297 118,307 L282,307 C291,297 295,286 297,276 Z"
          fill="#E5A002" opacity="0.6"/>
    <!-- clapper -->
    <rect x="168" y="315" width="64" height="20" rx="10" fill="#FFF8EF" opacity="0.9"/>
    <!-- sparkle -->
    <g transform="translate(282,118)">
      <path d="M0,-22 L6,-6 L22,0 L6,6 L0,22 L-6,6 L-22,0 L-6,-6 Z" fill="#FF5D5D"/>
    </g>
    <circle cx="310" cy="100" r="6" fill="#FF5D5D" opacity="0.7"/>
    <circle cx="266" cy="94"  r="5" fill="#FF5D5D" opacity="0.5"/>
    <circle cx="308" cy="142" r="4" fill="#FF5D5D" opacity="0.4"/>
  </g>

  <!-- ── WORDMARK ── -->
  <!-- TingTong -->
  <text x="298" y="128"
        font-family="'Trebuchet MS','Arial Black',Arial,sans-serif"
        font-size="86"
        font-weight="900"
        fill="#FFB703"
        letter-spacing="-2">TingTong</text>

  <!-- STORE -->
  <text x="304" y="172"
        font-family="'Trebuchet MS',Arial,sans-serif"
        font-size="36"
        font-weight="600"
        fill="#FFF8EF"
        letter-spacing="18">STORE</text>

  <!-- Divider -->
  <rect x="298" y="188" width="420" height="2" rx="1" fill="#FFB703" opacity="0.3"/>

  <!-- Tagline -->
  <text x="300" y="222"
        font-family="Arial,sans-serif"
        font-size="20"
        fill="#FFF8EF"
        opacity="0.6"
        letter-spacing="1">Great finds. Great prices. Fast shipping. 🛎️</text>

  <!-- ── RIGHT SIDE decorative pills ── -->
  <g transform="translate(860, 55)">
    <rect x="0"   y="0"  width="160" height="36" rx="18" fill="#FFB703" opacity="0.15"/>
    <text x="80"  y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#FFB703" opacity="0.9">✅ Fast Shipping</text>

    <rect x="0"   y="52" width="190" height="36" rx="18" fill="#FFB703" opacity="0.15"/>
    <text x="95"  y="75" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#FFB703" opacity="0.9">✅ 30-Day Returns</text>

    <rect x="0"   y="104" width="175" height="36" rx="18" fill="#FFB703" opacity="0.15"/>
    <text x="87"  y="127" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#FFB703" opacity="0.9">✅ Top-Rated Seller</text>

    <rect x="0"   y="156" width="165" height="36" rx="18" fill="#FFB703" opacity="0.15"/>
    <text x="82"  y="179" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#FFB703" opacity="0.9">✅ New Deals Daily</text>
  </g>

  <!-- Bottom accent line -->
  <rect x="0" y="264" width="1200" height="6" fill="#FFB703" opacity="0.5"/>

</svg>
