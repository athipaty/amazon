<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="700" height="200">

  <!-- Background -->
  <rect width="700" height="200" rx="24" fill="#FFF8EF"/>

  <!-- === ICON (left side) === -->
  <g transform="translate(20, 10)">

    <!-- Shadow -->
    <ellipse cx="90" cy="162" rx="48" ry="7" fill="#0F3D3E" opacity="0.12"/>

    <!-- Handle -->
    <path d="M62,88 Q62,52 90,52 Q118,52 118,88"
          fill="none" stroke="#0F3D3E" stroke-width="13" stroke-linecap="round"/>

    <!-- Bell body -->
    <path d="M62,88
             C52,103 40,122 38,145
             C36,156 44,166 58,169
             L122,169
             C136,166 144,156 142,145
             C140,122 128,103 118,88
             Z"
          fill="#FFB703"/>

    <!-- Inner highlight -->
    <ellipse cx="76" cy="124" rx="9" ry="17" fill="white" opacity="0.22" transform="rotate(-10,76,124)"/>

    <!-- Bell rim -->
    <path d="M38,145 C39,151 41,157 46,162 L134,162 C139,157 141,151 142,145 Z"
          fill="#E5A002" opacity="0.5"/>

    <!-- Clapper -->
    <rect x="72" y="167" width="36" height="12" rx="6" fill="#0F3D3E"/>

    <!-- Sparkle -->
    <g transform="translate(134,62)">
      <path d="M0,-13 L3,-3 L13,0 L3,3 L0,13 L-3,3 L-13,0 L-3,-3 Z" fill="#FF5D5D"/>
    </g>
    <circle cx="152" cy="52" r="4" fill="#FF5D5D" opacity="0.65"/>
    <circle cx="128" cy="49" r="3" fill="#FF5D5D" opacity="0.45"/>

  </g>

  <!-- === WORDMARK (right side) === -->
  <!-- TingTong -->
  <text x="210" y="95"
        font-family="'Poppins','Nunito','Trebuchet MS',Arial,sans-serif"
        font-size="64"
        font-weight="700"
        fill="#0F3D3E"
        letter-spacing="-1">TingTong</text>

  <!-- STORE -->
  <text x="214" y="138"
        font-family="'Poppins','Nunito','Trebuchet MS',Arial,sans-serif"
        font-size="30"
        font-weight="600"
        fill="#FF5D5D"
        letter-spacing="12">STORE</text>

  <!-- Tagline -->
  <text x="214" y="165"
        font-family="'DM Sans','Poppins',Arial,sans-serif"
        font-size="16"
        font-weight="400"
        fill="#0F3D3E"
        opacity="0.55"
        letter-spacing="0.5">Great finds. Great prices. Fast shipping.</text>

</svg>
